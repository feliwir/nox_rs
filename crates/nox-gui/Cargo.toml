[package]
name = "nox-gui"
description = "GTK4 user interface"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "nox"
path = "src/main.rs"

[dependencies]
gettext-rs.workspace = true
async-channel.workspace = true
gtk.workspace = true
adw.workspace = true
nox-ai.workspace = true
nox-fx.workspace = true
nox-text.workspace = true
nox-engine.workspace = true
nox-media.workspace = true
nox-otio.workspace = true
nox-project.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
# libadwaita 1.8's Keyboard Shortcuts dialog (Ctrl+?). On where the
# libadwaita built against is 1.8 or newer: the Flatpak, Windows and macOS
# packages and CI. Off for the Linux package (Debian 13 has 1.7).
adw-1-8 = ["adw/v1_8"]

[build-dependencies]
glib-build-tools.workspace = true

[lints]
workspace = true

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"
