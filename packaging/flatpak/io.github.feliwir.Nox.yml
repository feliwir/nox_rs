# Flatpak build of Nox, for CI, the release bundles and GNOME Builder.
#
#   flatpak run org.flatpak.Builder --user --install --force-clean \
#       --delete-build-dirs build/flatpak packaging/flatpak/io.github.feliwir.Nox.yml
#
# (--delete-build-dirs: a failed build otherwise leaves a copy of the source
# tree in .flatpak-builder/build, whose manifests GNOME Builder then finds.)
#
# The build may use the network: cargo fetches the crates (Flathub, which
# builds offline, vendors them in its own manifest). GNOME Builder builds
# the modules with flatpak-builder but Nox itself with its cargo support:
# `cargo build` with the nox module's config-opts, into its own build
# directory (the workspace's default member, `nox`); Run starts the
# command below, which the nox module's build-commands install.
#
# FFmpeg is built here, with x264, x265 (8 and 10 bit), NVENC, Vulkan and
# VAAPI; dav1d, SVT-AV1, libvpx, libjxl, Opus and LAME come from the SDK. The runtime's codecs-extra FFmpeg would do, but its NVENC needs
# NVIDIA's driver 610 or newer (nv-codec-headers 13.1); ours uses
# nv-codec-headers 13.0 (driver 570 or newer).
id: io.github.feliwir.Nox
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  # libclang, for bindgen (FFmpeg's bindings).
  - org.freedesktop.Sdk.Extension.llvm22
command: nox
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  # Vulkan, VAAPI and CUDA (NVENC): --device=dri also covers /dev/nvidia*,
  # /dev/nvidia-uvm included.
  - --device=dri
  # Projects refer to media files by path. Those in these folders open as
  # they are; others come through the document portal (file chooser, drag
  # and drop), and projects store their host paths (sandbox.rs).
  - --filesystem=xdg-videos
  - --filesystem=xdg-music:ro
  - --filesystem=xdg-pictures:ro
  # AI effects download their models the first time they're used.
  - --share=network
build-options:
  # cargo fetches crates while building.
  build-args:
    - --share=network
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm22/bin
  prepend-ld-library-path: /usr/lib/sdk/llvm22/lib
  # Builder applies this environment to its own cargo build too, so no
  # CARGO_HOME or CARGO_TARGET_DIR here (those are the nox module's).
  env:
    LIBCLANG_PATH: /usr/lib/sdk/llvm22/lib
    # Our FFmpeg in /app before the SDK's, for its headers (pkg-config) and
    # for linking: alsa-sys puts the SDK's library directory on the link
    # path, where the SDK's FFmpeg would be found first.
    PKG_CONFIG_PATH: /app/lib/pkgconfig:/app/share/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig
    RUSTFLAGS: -L native=/app/lib
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/ffmpeg
  - '*.a'
modules:
  - modules/ffmpeg.yml

  - name: nox
    buildsystem: simple
    # For flatpak-builder: the crates and the build in the module's build
    # directory. Builder uses its own (and ignores this environment when
    # building).
    build-options:
      env:
        CARGO_HOME: /run/build/nox/cargo
        CARGO_TARGET_DIR: /run/build/nox/target
    # Passed to `cargo build` by Builder.
    config-opts:
      - --features
      - nox-gui/adw-1-8
    # One script, as GNOME Builder runs a module's build-commands too: after
    # its own cargo build, on every build, each command in a sandbox of its
    # own, in its build directory (which is cargo's target directory there).
    # Under Builder it only installs the program Builder built, for Run
    # (the manifest's command); flatpak-builder (it sets
    # FLATPAK_BUILDER_BUILDDIR) builds and installs Nox.
    build-commands:
      - |
        set -eu
        if [ -z "${FLATPAK_BUILDER_BUILDDIR:-}" ]; then
          # Builder: its debug build, or its release build if newer.
          profile=debug
          if [ release/nox -nt debug/nox ]; then profile=release; fi
          for program in nox nox-cli; do
            if [ -e "$profile/$program" ]; then
              install -Dm755 "$profile/$program" "/app/bin/$program"
            fi
          done
          test -x /app/bin/nox
          echo "Installed Builder's $profile build"
          exit 0
        fi
        # Every crate of the workspace: the install collects their license
        # texts (cargo metadata --offline).
        cargo fetch --locked
        cargo build --release --locked --package nox-gui --package nox-cli --features nox-gui/adw-1-8
        # Fail if the programs linked another FFmpeg than ours (whose
        # headers the bindings came from).
        linked=$(objdump -p "$CARGO_TARGET_DIR/release/nox" | grep NEEDED | grep -o 'libavcodec\.so\.[0-9]*')
        ours=$(objdump -p /app/lib/libavcodec.so | grep SONAME | grep -o 'libavcodec\.so\.[0-9]*')
        echo "FFmpeg linked $linked, built $ours"
        test "$linked" = "$ours"
        cargo run --locked --package xtask -- install --prefix /app --no-build
    sources:
      - type: dir
        path: ../..
        skip:
          - target
          - build
          - .git
          - .claude
          - vcpkg_installed
